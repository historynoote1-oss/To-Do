name: CI

# بيشتغل مع كل push أو pull_request على أي فرع.
# ملحوظة: ده ملف منفصل عن build-android.yml ومالوش أي علاقة ببناء الـ APK.
on:
  push:
  pull_request:

jobs:
  backend-typecheck:
    name: Backend Type-Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: تثبيت باكدجات الباك إند
        run: npm ci

      # tsc --noEmit بس (بدون build فعلي) — الهدف هنا هو الإمساك بأخطاء
      # الـ types بدري، مش إنتاج dist/. الـ postinstall بتاع الباكدج بيشغّل
      # "prisma generate" تلقائيًا مع npm ci، فأنواع Prisma Client هتكون
      # جاهزة قبل الـ type-check.
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: تثبيت باكدجات الواجهة
        run: npm ci

      # tsc --noEmit قبل الـ build: عشان vite build (esbuild) بيعمل transpile
      # بس من غير type-check حقيقي، فأخطاء الـ types محتاجة الخطوة دي
      # صراحة عشان توقف الـ CI. tsconfig.json بتاع الفرونت إند فيه
      # "noEmit": true أصلًا، فمفيش خطر إن الأمر ده ينتج ملفات.
      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      # vite build كامل (esbuild bundling). مفيش .env هنا لأن متغيرات
      # VITE_* مش لازمة وقت الـ build نفسه (بتتقرا وقت التشغيل في
      # المتصفح)، فمفيش سيكرتس مطلوبة للـ gate ده.
      - name: بناء الواجهة (Vite build)
        run: npm run build
