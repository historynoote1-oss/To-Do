<!DOCTYPE html>
<!--
  صفحة أوفلاين محلية — بتتحمّل من جوه التطبيق نفسه (file:///android_asset)
  لما الـ WebView يفشل يوصل لموقع الويب المنشور بسبب مفيش نت. لازم الملف
  ده يفضل قائم بذاته بالكامل (من غير أي CDN أو خط أو أيقونة خارجية) لأنه
  بيتعرض بالظبط في اللحظة اللي مفيش فيها نت أصلاً.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>مفيش اتصال بالإنترنت</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0714;
    color: #f4f1fb;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    max-width: 320px;
  }
  .icon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 76px;
    height: 76px;
    border-radius: 22px;
    background: linear-gradient(155deg, #7c3aed, #4c1d95);
    box-shadow: 0 18px 44px rgba(124, 58, 237, 0.35);
  }
  h1 {
    margin: 4px 0 0;
    font-size: 19px;
    font-weight: 700;
    color: #f4f1fb;
  }
  p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.7;
    color: #b3a8cf;
  }
  button {
    margin-top: 6px;
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(155deg, #7c3aed, #5b21b6);
    color: #f4fbfa;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(124, 58, 237, 0.4);
  }
  button:active {
    transform: scale(0.97);
  }
  .status {
    margin-top: 2px;
    font-size: 11.5px;
    color: #7a6f96;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <!-- أيقونة واي فاي مقطوعة — SVG مضمّن، بدون أي اعتماد خارجي -->
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#f4f1fb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>مفيش اتصال بالإنترنت</h1>
    <p>تأكد إن الواي فاي أو بيانات الموبايل شغالة، وجرّب تاني.</p>
    <button id="retryBtn" type="button">إعادة المحاولة</button>
    <span class="status" id="status"></span>
  </div>

  <script>
    // نفس الرابط المضبوط في capacitor.config.ts (server.url) وفي
    // OfflineFallback.kt — لو اتغيّر هناك، غيّره هنا كمان.
    var LIVE_URL = 'https://kharita.vercel.app/';
    var statusEl = document.getElementById('status');

    function retry() {
      statusEl.textContent = 'بيحاول يتصل...';
      window.location.href = LIVE_URL;
    }

    document.getElementById('retryBtn').addEventListener('click', retry);

    // إعادة محاولة تلقائية أول ما الجهاز يحس إن النت رجع، من غير ما
    // المستخدم يحتاج يدوس على الزرار بنفسه.
    window.addEventListener('online', retry);

    // شبكة بعض الأجهزة بتاخد لحظة تتأكد إنها "شغالة فعليًا" حتى بعد حدث
    // 'online' (اتصال متاح لكن لسه مفيش إنترنت فعلي)، فبنعمل محاولة
    // تلقائية دورية كمان كشبكة أمان إضافية.
    setInterval(function () {
      if (navigator.onLine) retry();
    }, 5000);
  </script>
</body>
</html>
